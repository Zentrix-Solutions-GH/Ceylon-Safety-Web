# This file is tracked in git (committed in S-132).
# If you already have a local supabase/config.toml, git pull may fail with
# "untracked file would be overwritten by merge". To fix:
#   git stash -u && git pull && git stash pop
# Local overrides belong in supabase/config.local.toml (gitignored).

project_id = "ceylonsafety"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.settings]
# Sets the app.environment GUC on the local database.
# seed.dev.sql checks for this value and aborts if it is not 'development',
# preventing the dev seed from running on production.
app.environment = "development"

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
openai_api_key = "env(OPENAI_API_KEY)"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.image_transformation]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 8
password_requirements = ""

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1s"
# EC1: Supabase local stack caps OTP length at 6; production dashboard allows 8.
# 6 digits with 10-minute expiry is the fallback recorded in docs/ops/auth-settings.md.
otp_length = 6
otp_expiry = 600
# Template paths (relative to supabase/ directory)
template.confirm_signup = "./templates/confirm-signup.html"
template.recovery = "./templates/reset-password.html"
template.reauthentication = "./templates/reauthentication.html"
template.magic_link = "./templates/magic-link.html"

[auth.sms]
enable_signup = false
enable_confirmations = false
template = "Your code is {{ .Code }}"
max_frequency = "5s"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
otp_length = 6
template = "Your code is {{ .Code }}"
max_frequency = "5s"

# AC1: Google is the only external provider enabled.
# Credentials come from environment variables; never hardcode them.
[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
# AC8: exact callback path, no wildcards
redirect_uri = "http://127.0.0.1:3000/api/auth/callback"
skip_nonce_check = false

# AC5: Cloudflare Turnstile captcha.
# Local/CI use the published always-pass test key so sign-up and sign-in
# succeed without a real browser challenge.
# Production: credentials set in the Supabase dashboard only, never in this file.
[auth.captcha]
enabled = true
provider = "turnstile"
# Cloudflare always-pass test key (published; safe to commit).
secret = "1x0000000000000000000000000000000AA"

# AC6: Enable the custom access token hook created in S-012.
# The hook adds user_role and account_status to every issued JWT.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/private/custom_access_token_hook"

[auth.sessions]
timebox = "168h"
inactivity_timeout = "168h"

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[analytics]
enabled = false
port = 54327
backend = "postgres"
