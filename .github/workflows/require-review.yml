name: Review Guard

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [dev, main]
  pull_request_review:
    types: [submitted, dismissed]

jobs:
  check-review:
    name: Require review on HEAD
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check if review required
        id: docs_check
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            // Only story branches (feature/S-NNN-*) require external review.
            // Infrastructure, CI, chore, and docs branches are self-mergeable.
            const isStoryBranch = /^feature\/S-\d+/i.test(branch);
            if (!isStoryBranch) {
              console.log(`✓ Non-story branch (${branch}) — review not required.`);
              return true;
            }
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const allDocs = files.length > 0 && files.every(f =>
              f.filename.startsWith('docs/') ||
              f.filename === 'CLAUDE.md' ||
              f.filename === 'README.md'
            );
            if (allDocs) {
              console.log(`✓ Docs-only PR (${files.length} file(s)) — review not required.`);
            }
            return allDocs;

      - name: Check for external review on current HEAD
        if: steps.docs_check.outputs.result != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const headSha = pr.head.sha;
            const prAuthor = pr.user.login;

            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });

            // Only reviews on the current HEAD, from someone other than the PR author,
            // that have not been dismissed.
            const headReviews = reviews.filter(r =>
              r.commit_id === headSha &&
              r.state !== 'DISMISSED' &&
              r.user.login !== prAuthor &&
              ['APPROVED', 'CHANGES_REQUESTED'].includes(r.state)
            );

            if (headReviews.length === 0) {
              core.setFailed(
                `No external review on HEAD (${headSha.slice(0, 7)}). ` +
                `Someone other than ${prAuthor} must submit a review after the latest commit.`
              );
              return;
            }

            const changesRequested = headReviews.filter(r => r.state === 'CHANGES_REQUESTED');
            if (changesRequested.length > 0) {
              const names = changesRequested.map(r => r.user.login).join(', ');
              core.setFailed(
                `Changes requested by: ${names}. ` +
                `Fix the issues and push a new commit — the reviewer must re-review.`
              );
              return;
            }

            const approved = headReviews.filter(r => r.state === 'APPROVED');
            const names = approved.map(r => r.user.login).join(', ');
            console.log(`✓ Approved by: ${names}`);
