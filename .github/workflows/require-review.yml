name: Review Guard

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [dev, main]
  pull_request_review:
    types: [submitted, dismissed]

jobs:
  check-review:
    name: Require review on HEAD
    runs-on: ubuntu-latest
    steps:
      - name: Check if docs-only PR
        id: docs_check
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            const allDocs = files.length > 0 && files.every(f =>
              f.filename.startsWith('docs/') ||
              f.filename === 'CLAUDE.md' ||
              f.filename === 'README.md'
            );
            if (allDocs) {
              console.log(`✓ Docs-only PR (${files.length} file(s)) — review not required.`);
            }
            return allDocs;

      - name: Check for review on current HEAD
        if: steps.docs_check.outputs.result != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const headSha = pr.head.sha;

            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });

            // Only count reviews submitted against the current HEAD commit
            const validReviews = reviews.filter(r =>
              r.commit_id === headSha &&
              r.state !== 'DISMISSED' &&
              ['APPROVED', 'CHANGES_REQUESTED', 'COMMENTED'].includes(r.state)
            );

            if (validReviews.length === 0) {
              core.setFailed(
                `No review found on HEAD (${headSha.slice(0, 7)}). ` +
                `A reviewer must submit a review after the latest commit.`
              );
            } else {
              const names = validReviews.map(r => r.user.login).join(', ');
              console.log(`✓ ${validReviews.length} review(s) on HEAD by: ${names}`);
            }
