name: ci

on:
  pull_request:
    branches: [dev]

jobs:
  lint-typecheck:
    name: lint-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - run: bash scripts/check.sh

  audit:
    name: audit
    runs-on: ubuntu-latest
    needs: [lint-typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - run: npm audit --audit-level=high

  db-tests:
    name: db-tests
    runs-on: ubuntu-latest
    needs: [lint-typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Start Supabase
        run: supabase start
        timeout-minutes: 5

      - name: Reset database (run all migrations)
        run: supabase db reset --no-confirm

      - name: Run pgTAP tests
        run: supabase test db
