name: ci

on:
  pull_request:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: lint-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - run: bash scripts/check.sh

  audit:
    name: audit
    runs-on: ubuntu-latest
    needs: [lint-typecheck]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - run: npm audit --omit=dev --audit-level=high

  db-tests:
    name: db-tests
    runs-on: ubuntu-latest
    needs: [lint-typecheck]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: supabase/setup-cli@2b65cf0aa3867ec8426b3adf8f2df81844aee6d0 # v1
        with:
          version: 2.122.0

      - name: Start Supabase
        run: |
          for attempt in 1 2 3; do
            echo "Attempt $attempt/3"
            supabase start && break
            [ $attempt -lt 3 ] && echo "Retrying in 30s..." && sleep 30
          done || { echo "supabase start failed after 3 attempts"; exit 1; }

      - name: Reset database (run all migrations)
        run: supabase db reset --yes

      - name: Run pgTAP tests
        run: supabase test db

      - name: Check types file freshness
        run: |
          supabase gen types typescript --local > /tmp/database.ts.generated
          if ! diff -q /tmp/database.ts.generated types/database.ts > /dev/null 2>&1; then
            echo "types/database.ts is stale — run: supabase gen types typescript --local > types/database.ts"
            diff /tmp/database.ts.generated types/database.ts || true
            exit 1
          fi
          echo "types/database.ts is up to date"
